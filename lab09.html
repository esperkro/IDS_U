<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab 09 — IDS Training</title>
<link rel="stylesheet" href="module-kit.css">
<script src="labs-access.js"></script>
<script>LabsAccess.guard('lab09');</script>
</head>
<body>
<div id="app"><noscript><p style="padding:16px">IDS Training needs JavaScript enabled.</p></noscript></div>
<script src="module-kit.js"></script>
<script src="questions.js"></script>
<script src="assessment.js"></script>
<script>
ModuleKit.mount({
  id: 'lab09',
  briefing: {
    hook: 'Every security tool demo detects the attack it was built to demo. Your job is to find out whether it detects <em>yours</em> — on <em>your</em> data, with <em>your</em> team.',
    lead: 'User intrusion detection is delivered by several families of tools: <strong>host-based IDS</strong> (e.g. OSSEC, Wazuh), <strong>SIEM</strong> platforms with correlation rules (e.g. Elastic Security, Splunk, Microsoft Sentinel), and <strong>UEBA</strong> features that model user behaviour. Choosing well means defining requirements, weighting them honestly and testing with a proof of concept.',
    stats: [
      { value: 'TCO', label: 'Total cost of ownership', note: 'Licence + infrastructure + storage + staff time to run and tune. “Free” software is never free to operate.' },
      { value: 'PoC', label: 'Test on your own data', note: 'Replay realistic attacks in your lab and measure what each tool actually detects and how noisy it is.' },
      { value: 'Weights', label: 'Agree them before scoring', note: 'Set criteria weights before seeing results, so the favourite product doesn’t shape the scorecard.' }
    ],
    objectives: [
      'Distinguish HIDS, SIEM and UEBA capabilities.',
      'Define weighted evaluation criteria from requirements.',
      'Separate strong evidence (PoC results) from weak evidence (marketing claims).',
      'Recommend a solution with a defensible rationale.'
    ],
    blocks: [{ type: 'myths', items: [
      { myth: 'Open-source tools are less capable than commercial ones.', fact: 'Mature open-source tools are widely used in production. The real trade-off is usually support, staff effort and integration — not raw capability.' },
      { myth: 'The product with the most features wins.', fact: 'Unused features cost money and attention. Score against your requirements, not the vendor’s feature list.' },
      { myth: 'A tool that claims “AI-powered detection” needs no tuning.', fact: 'Every detection tool needs tuning to your environment. Ask how false positives are handled and how much analyst time that takes.' }
    ] }]
  },
  scenario: {
    meta: ['College IT team', '1,200 endpoints', '1 security analyst'],
    title: 'Three vendors, one analyst',
    story: '<p>Greenfield College has a modest budget and one security analyst. Requirements: monitor Windows and Linux logons and admin activity, file integrity on servers, alert on suspicious user behaviour, keep student data within the country. Three options are on the table: an open-source HIDS/SIEM stack the team would self-host, a commercial SIEM with UEBA in the cloud, and a managed detection service.</p>',
    blocks: [
      { type: 'choice', title: 'Decision — How to evaluate', prompt: 'What is the most defensible evaluation approach?', options: [
        { text: 'Agree weighted criteria first, run a 2-week PoC of the top two on lab and pilot data with replayed attacks, then score and estimate 3-year TCO.', verdict: 'good', why: 'Requirements drive weights, evidence drives scores, and TCO captures the hidden staffing cost that matters for a one-person team.' },
        { text: 'Pick the vendor at the top of an analyst ranking report.', verdict: 'partial', why: 'Industry reports are a useful shortlist input, but they don’t reflect your data, staff or residency needs.' },
        { text: 'Choose whichever vendor gives the biggest discount this quarter.', verdict: 'bad', why: 'Price without fit leads to shelfware — and the discount often disappears at renewal.' }
      ] }
    ]
  },
  practice: {
    intro: 'Set weights that reflect Greenfield College’s priorities and see how the recommendation changes.',
    blocks: [
      { type: 'custom', title: 'Weighted scoring matrix', tag: 'Builder', intro: 'Ratings (1–5) are illustrative results from a fictional PoC — not ratings of real products. Adjust the weights (0–5).', render: function (host, K) {
        var crit = [
          ['Data-source coverage (Win/Linux/cloud)', [4, 5, 4], 4],
          ['Detection quality in PoC', [3, 4, 5], 5],
          ['False-positive / tuning effort', [2, 4, 5], 3],
          ['Fits 1-analyst team (operational effort)', [2, 3, 5], 3],
          ['3-year cost (TCO)', [5, 2, 1], 3],
          ['Data residency & privacy', [5, 3, 2], 4],
          ['Integration (ticketing, SOAR, APIs)', [3, 5, 3], 2]
        ];
        var names = ['A · Self-hosted open-source HIDS/SIEM', 'B · Cloud SIEM + UEBA', 'C · Managed detection service'];
        var wrap = K.el('div', { class: 'table-wrap' });
        var res = K.el('div', { class: 'feedback', 'aria-live': 'polite' });
        var sliders = [];
        var form = K.el('div', { class: 'sim-grid two', style: 'margin-bottom:12px' });
        crit.forEach(function (c, i) {
          var id = 'w' + i, s = K.el('input', { type: 'range', min: '0', max: '5', value: String(c[2]), id: id });
          var l = K.el('label', { for: id });
          s.addEventListener('input', calc);
          sliders.push([s, l, c[0]]);
          form.appendChild(K.el('div', { class: 'field' }, [l, s]));
        });
        function calc() {
          var tot = [0, 0, 0], wsum = 0;
          sliders.forEach(function (x, i) { var w = +x[0].value; x[1].textContent = x[2] + ' — weight ' + w; wsum += w; crit[i][1].forEach(function (r, j) { tot[j] += r * w; }); });
          var rows = crit.map(function (c, i) { return '<tr><td>' + c[0] + '</td><td>' + sliders[i][0].value + '</td>' + c[1].map(function (r) { return '<td>' + r + '</td>'; }).join('') + '</tr>'; }).join('');
          var pct = tot.map(function (t) { return wsum ? Math.round(t / (wsum * 5) * 100) : 0; });
          wrap.innerHTML = '<table><thead><tr><th>Criterion</th><th>W</th><th>A</th><th>B</th><th>C</th></tr></thead><tbody>' + rows + '<tr><th>Weighted score</th><th></th>' + pct.map(function (p) { return '<th>' + p + '%</th>'; }).join('') + '</tr></tbody></table>';
          var best = pct.indexOf(Math.max.apply(null, pct));
          var sorted = pct.slice().sort(function (a, b) { return b - a; });
          var close = sorted[0] - sorted[1] <= 3;
          K.setFeedback(res, close ? 'partial' : 'good', '<p>Leader: <strong>' + names[best] + '</strong> (' + pct[best] + '%).</p>' + (close ? '<p>The top two are within 3 points — the scorecard alone can’t decide. Use the PoC findings, references and risk appetite to break the tie, and document why.</p>' : '<p>Now check sensitivity: does the winner change if you move any single weight by ±1? A robust choice survives small changes.</p>'), close ? 'Too close to call' : 'Recommendation');
        }
        host.appendChild(form); host.appendChild(wrap); host.appendChild(res);
        calc();
      } },
      { type: 'sort', title: 'Strong or weak evidence?', left: 'Strong evidence', right: 'Weak evidence', intro: 'Which inputs should carry weight in your evaluation?', items: [
        { text: 'PoC: replayed brute-force, new-admin and log-clear scenarios — tool detected 5 of 6 with 2 false positives/day.', answer: 'left', why: 'Measured on your data with known attacks.' },
        { text: 'Vendor datasheet: “detects 99.9% of threats”.', answer: 'right', why: 'Unverifiable, undefined test set, marketing context.' },
        { text: 'Reference call with a similar-sized college running it for 2 years.', answer: 'left', why: 'Real-world operational experience from a comparable organisation.' },
        { text: 'An impressive demo using the vendor’s own pre-loaded data.', answer: 'right', why: 'Demos are designed to succeed; they show capability, not fit.' },
        { text: 'Measured analyst time per day spent triaging during the pilot.', answer: 'left', why: 'Directly measures the operational cost for a one-analyst team.' },
        { text: 'The product has the most integrations listed on its website.', answer: 'right', why: 'Quantity of integrations says nothing about the ones you need.' }
      ] }
    ]
  },
  playbook: {
    rules: [
      ['Start from requirements. ', 'Data sources, detections, team size, budget, residency — written down before talking to vendors.'],
      ['Weight before you score. ', 'Agree weights with stakeholders first so the scorecard can’t be bent to a favourite.'],
      ['Prove it in a PoC. ', 'Replay realistic attacks on your own data; measure detections, false positives and analyst time.'],
      ['Count the whole cost. ', 'Licences, infrastructure, storage growth, training and staff time over at least three years.'],
      ['Check the exits. ', 'Data export, contract terms and lock-in matter when you outgrow the tool.'],
      ['Document the decision. ', 'Record scores, evidence and the reasoning so the choice can be reviewed later.']
    ],
    quote: ['Buy the tool your team can run on a bad day, not the one that looked best on a good demo.']
  }
});
</script>
</body>
</html>
